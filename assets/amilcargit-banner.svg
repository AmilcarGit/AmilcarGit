<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AmilcarGit — Developer</title>
  <desc id="desc">Banner tecnológico negro con circuitos verdes y violetas, representando bots, inteligencia artificial y herramientas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset=".55" stop-color="#10101b"/>
      <stop offset="1" stop-color="#080d0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35f2a1"/>
      <stop offset=".52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#35f2a1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b5cf6" stroke-opacity=".12" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#35f2a1" fill-opacity=".35"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="920" cy="170" rx="360" ry="240" fill="url(#glow)"/>
  <circle cx="1010" cy="90" r="78" fill="#35f2a1" opacity=".08" filter="url(#blur)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65">
    <path d="M740 0V58H830V92H925"/>
    <path d="M1200 65H1120V118H1060V151H1010"/>
    <path d="M1200 275H1100V236H1040V210H980"/>
    <path d="M790 360V304H865V272H930"/>
    <path d="M0 72H92V105H150"/>
    <path d="M0 285H70V250H125V222H178"/>
  </g>
  <g fill="#35f2a1">
    <circle cx="925" cy="92" r="4"/><circle cx="1010" cy="151" r="4"/><circle cx="930" cy="272" r="4"/><circle cx="150" cy="105" r="4"/>
  </g>
  <g fill="#a78bfa" opacity=".9">
    <circle cx="1120" cy="65" r="3"/><circle cx="1100" cy="275" r="3"/><circle cx="92" cy="72" r="3"/><circle cx="125" cy="250" r="3"/>
  </g>
  <rect x="62" y="66" width="5" height="205" rx="2.5" fill="url(#accent)"/>
  <text x="92" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="5" fill="#35f2a1">OPEN SOURCE • DEVELOPER</text>
  <text x="88" y="193" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="800" letter-spacing="-2" fill="#f8fafc">AMILCARGIT</text>
  <text x="92" y="232" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c4b5fd">Bots · Inteligencia artificial · Herramientas · Web</text>
  <path d="M92 259H530" stroke="url(#accent)" stroke-width="2"/>
  <text x="92" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2" fill="#94a3b8">CREAR  /  PROBAR  /  MEJORAR  /  COMPARTIR</text>
  <g transform="translate(925 180)">
    <circle r="83" fill="#080b10" stroke="#35f2a1" stroke-opacity=".7" stroke-width="2"/>
    <circle r="69" fill="none" stroke="#8b5cf6" stroke-opacity=".85" stroke-width="1.5" stroke-dasharray="5 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle r="53" fill="none" stroke="#35f2a1" stroke-opacity=".55" stroke-width="1"/>
    <path d="M-25 -22L-47 0L-25 22M25 -22L47 0L25 22M10 -34L-10 34" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-58" r="4" fill="#35f2a1"/>
    <circle cx="50" cy="22" r="4" fill="#a78bfa"/>
  </g>
  <text x="1080" y="332" font-family="ui-monospace, monospace" font-size="11" text-anchor="end" fill="#64748b">GH / AMILCARGIT</text>
