name: Check project links

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - .github/workflows/check-links.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - .github/workflows/check-links.yml
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Verify profile and project READMEs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Download current README files from public projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project-readmes
          for repo in AmilcarTools AMILCAR-AI YuiBot-MD S7-Bot-OFC BaseBot YuiBoost FamilyBot-MD1 TheEly-MD yuianon; do
            echo "Fetching README for ${repo}"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/AmilcarGit/${repo}/main/README.md" \
              --output "project-readmes/${repo}.md"
          done

      - name: Check links in profile and project READMEs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --retry-wait-time 2
            --timeout 20
            --exclude 'https://img.shields.io/.*'
            --exclude 'file://.*'
            --exclude 'http://localhost:.*'
            --exclude 'https://skillicons.dev/.*'
            --exclude 'https://raw.githubusercontent.com/AmilcarGit/AmilcarGit/output/.*'
            README.md
            project-readmes/*.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
