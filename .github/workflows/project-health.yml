name: Refresh project health dashboard

on:
  push:
    branches: [main]
    paths:
      - scripts/update-project-health.mjs
      - .github/workflows/project-health.yml
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-health
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate report from GitHub public metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-project-health.mjs
      - name: Commit report if changed
        run: |
          if git ls-files --error-unmatch PROJECT_HEALTH.md >/dev/null 2>&1 && git diff --quiet -- PROJECT_HEALTH.md; then
            echo "Project health report is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_HEALTH.md
          git commit -m "chore: refresh project health dashboard"
          git push
